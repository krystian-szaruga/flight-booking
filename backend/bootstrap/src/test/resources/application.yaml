spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
  mail:
    host: localhost
    port: 1025

app:
  auth:
    jwt-secret: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    jwt-ttl-minutes: 60
    cookie:
      secure: false
      same-site: Lax
    login-attempts:
      max-failures: 5
      window-minutes: 15
    revoked-token:
      purge-enabled: false
      purge-cron: "0 0 * * * *"
    verification:
      code-ttl-minutes: 15
      purge-enabled: false
      purge-cron: "0 0 * * * *"
  mail:
    app-name: flight-booking
    from: no-reply@flight-booking.local
    enabled: false
  security:
    passport:
      encryption-key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=

catalogue:
  providers:
    file:
      enabled: true
      location: classpath:seed/feed.json
  pull:
    enabled: false
    on-startup: false
    cron: "0 0 */6 * * *"
    horizon-days: 60

reservation:
  expiry:
    enabled: false
    cron: "0 * * * * *"
