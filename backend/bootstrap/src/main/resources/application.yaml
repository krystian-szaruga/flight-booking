spring:
  application:
    name: flight-booking
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 200
        order_inserts: true
  flyway:
    enabled: true

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:60}
    cookie:
      secure: ${COOKIE_SECURE:true}
      same-site: ${COOKIE_SAME_SITE:Lax}
    login-attempts:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window-minutes: ${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
    verification:
      code-ttl-minutes: ${VERIFICATION_CODE_TTL_MINUTES:15}
      purge-enabled: ${PENDING_REGISTRATION_PURGE_ENABLED:true}
      purge-cron: ${PENDING_REGISTRATION_PURGE_CRON:0 0 * * * *}
    revoked-token:
      purge-enabled: ${REVOKED_TOKEN_PURGE_ENABLED:true}
      purge-cron: ${REVOKED_TOKEN_PURGE_CRON:0 0 * * * *}
  mail:
    app-name: ${APP_NAME:flight-booking}
    from: ${MAIL_FROM:no-reply@flight-booking.local}
    enabled: ${MAIL_ENABLED:true}
  payments:
    provider: ${PAYMENT_PROVIDER:fake}

management:
  endpoints:
    web:
      exposure:
        include: health,info

catalogue:
  providers:
    file:
      enabled: ${FILE_PROVIDER_ENABLED}
      location: ${FILE_PROVIDER_LOCATION}
  pull:
    enabled: ${PULL_ENABLED}
    on-startup: ${PULL_ON_STARTUP}
    cron: ${PULL_CRON}
    horizon-days: ${PULL_HORIZON_DAYS}

reservation:
  expiry:
    enabled: ${RESERVATION_EXPIRY_ENABLED:true}
    cron: ${RESERVATION_EXPIRY_CRON:0 * * * * *}
