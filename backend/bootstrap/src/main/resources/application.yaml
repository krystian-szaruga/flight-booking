spring:
  application:
    name: flight-booking
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 200
        order_inserts: true
  flyway:
    enabled: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: ${MAIL_SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${MAIL_STARTTLS:false}

app:
  auth:
    jwt-secret: ${JWT_SECRET}
    jwt-ttl-minutes: ${JWT_TTL_MINUTES:15}
    refresh-ttl-days: ${REFRESH_TTL_DAYS:7}
    cookie:
      secure: ${COOKIE_SECURE:true}
      same-site: ${COOKIE_SAME_SITE:Lax}
    login-attempts:
      max-failures: ${LOGIN_MAX_FAILURES:5}
      window-minutes: ${LOGIN_ATTEMPT_WINDOW_MINUTES:15}
    verification:
      code-ttl-minutes: ${VERIFICATION_CODE_TTL_MINUTES:15}
      purge-enabled: ${PENDING_REGISTRATION_PURGE_ENABLED:true}
      purge-cron: ${PENDING_REGISTRATION_PURGE_CRON:0 0 * * * *}
    revoked-token:
      purge-enabled: ${REVOKED_TOKEN_PURGE_ENABLED:true}
      purge-cron: ${REVOKED_TOKEN_PURGE_CRON:0 0 * * * *}
  mail:
    app-name: ${APP_NAME:flight-booking}
    from: ${MAIL_FROM:no-reply@flight-booking.local}
    enabled: ${MAIL_ENABLED:true}
  payments:
    provider: ${PAYMENT_PROVIDER:fake}
  currency:
    default: ${CURRENCY_DEFAULT:PLN}
  security:
    passport:
      encryption-key: ${PASSPORT_ENCRYPTION_KEY}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  api-docs:
    path: /v3/api-docs
    enabled: ${SWAGGER_UI_ENABLED:false}
  swagger-ui:
    path: /swagger-ui.html
    enabled: ${SWAGGER_UI_ENABLED:false}
  paths-to-match: /api/**

catalogue:
  providers:
    file:
      enabled: ${FILE_PROVIDER_ENABLED}
      location: ${FILE_PROVIDER_LOCATION:classpath:feed-ci.json}
  pull:
    enabled: ${PULL_ENABLED}
    on-startup: ${PULL_ON_STARTUP}
    cron: ${PULL_CRON}
    horizon-days: ${PULL_HORIZON_DAYS}

reservation:
  expiry:
    enabled: ${RESERVATION_EXPIRY_ENABLED:true}
    cron: ${RESERVATION_EXPIRY_CRON:0 * * * * *}

notification:
  topic: ${NOTIFICATION_TOPIC}
  consumer-group: ${NOTIFICATION_CONSUMER_GROUP}
  kafka:
    enabled: ${NOTIFICATION_KAFKA_ENABLED}
  payment-reminder:
    enabled: ${PAYMENT_REMINDER_ENABLED}
    lead-minutes: ${PAYMENT_REMINDER_LEAD_MINUTES}
    cron: ${PAYMENT_REMINDER_CRON}
  departure-reminder:
    enabled: ${DEPARTURE_REMINDER_ENABLED}
    lead-hours: ${DEPARTURE_REMINDER_LEAD_HOURS}
    cron: ${DEPARTURE_REMINDER_CRON}
