spring:
  application:
    name: flight-booking
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/flights}
    username: ${DB_USER:flights}
    password: ${DB_PASSWORD:flights}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info