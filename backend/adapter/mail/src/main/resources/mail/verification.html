<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:24px;background:#f4f5f7;font-family:Arial,Helvetica,sans-serif;color:#1f2933;">
<div style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:8px;padding:32px;">
<h1 style="margin:0 0 16px;font-size:20px;">Verify your email</h1>
<p style="margin:0 0 16px;font-size:14px;line-height:20px;">Your {appName} verification code is:</p>
<p style="margin:0 0 16px;font-size:28px;letter-spacing:6px;font-weight:bold;">{code}</p>
<p style="margin:0 0 16px;font-size:14px;line-height:20px;">The code expires in {ttlMinutes} minutes.</p>
<p style="margin:0;font-size:12px;line-height:18px;color:#6b7280;">If you did not create a {appName} account, you can ignore this message.</p>
</div>
</body>
</html>
