name: CI

on:
  push:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'load/**'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]
    paths:
      - 'backend/**'
      - 'frontend/**'
      - 'infra/**'
      - 'load/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build and test
        run: ./gradlew build --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-reports
          path: backend/**/build/reports/tests/
          if-no-files-found: ignore

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  infra:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: [build-and-test, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install podman
        run: |
          sudo apt-get update
          sudo apt-get install -y podman gettext-base

      - name: Write CI env
        working-directory: infra
        run: |
          set -euo pipefail

          DB_PASSWORD=$(openssl rand -hex 16)
          JWT_SECRET=$(openssl rand -base64 48 | tr -d '\n')
          PASSPORT_ENCRYPTION_KEY=$(openssl rand -base64 32 | tr -d '\n')

          echo "::add-mask::$DB_PASSWORD"
          echo "::add-mask::$JWT_SECRET"
          echo "::add-mask::$PASSPORT_ENCRYPTION_KEY"

          cat > .env <<'EOF'
          DB_NAME=flights
          DB_USER=flights
          KAFKA_NODE_ID=1
          KAFKA_PROCESS_ROLES=broker,controller
          KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092
          KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
          KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
          KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS=0
          KAFKA_BOOTSTRAP_SERVERS=localhost:9092
          NOTIFICATION_TOPIC=flight-booking.notifications
          NOTIFICATION_CONSUMER_GROUP=flight-booking-notifications
          NOTIFICATION_KAFKA_ENABLED=true
          PAYMENT_REMINDER_ENABLED=true
          PAYMENT_REMINDER_LEAD_MINUTES=10
          PAYMENT_REMINDER_CRON="0 * * * * *"
          DEPARTURE_REMINDER_ENABLED=true
          DEPARTURE_REMINDER_LEAD_HOURS=24
          DEPARTURE_REMINDER_CRON="0 */5 * * * *"
          FILE_PROVIDER_ENABLED=true
          FILE_PROVIDER_LOCATION=classpath:feed-ci.json
          COOKIE_SECURE=false
          SWAGGER_UI_ENABLED=true
          PULL_CRON="0 0 */6 * * *"
          PULL_ENABLED=true
          PULL_HORIZON_DAYS=400
          PULL_ON_STARTUP=true
          EOF

          {
            echo "DB_PASSWORD=$DB_PASSWORD"
            echo "JWT_SECRET=$JWT_SECRET"
            echo "PASSPORT_ENCRYPTION_KEY=$PASSPORT_ENCRYPTION_KEY"
          } >> .env

          chmod 600 .env

      - name: Start infra
        run: ./infra/up.sh

      - name: Install k6
        run: |
          curl -sSL https://dl.k6.io/key.gpg \
            | sudo gpg --dearmor -o /usr/share/keyrings/k6-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/k6-archive-keyring.gpg] https://dl.k6.io/deb stable main" \
            | sudo tee /etc/apt/sources.list.d/k6.list
          sudo apt-get update
          sudo apt-get install -y k6

      - name: Load tests
        env:
          BASE_URL: http://localhost:8080
          MAILPIT_URL: http://localhost:8025
        run: |
          ready=0
          for i in $(seq 1 60); do
            if curl -fsS "$BASE_URL/actuator/health" >/dev/null 2>&1 \
              && curl -fsS http://localhost:5173/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 5
          done
          if [ "$ready" != "1" ]; then
            echo "infra did not become healthy" >&2
            exit 1
          fi
          ./load/run.sh smoke.js
          ./load/run.sh booking.js
          ./load/run.sh contention.js

      - name: Stop infra
        if: always()
        run: podman kube down infra/infrastructure.yaml || true