apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: flights-deps
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:18
      env:
        - name: POSTGRES_DB
          value: "${POSTGRES_DB}"
        - name: POSTGRES_USER
          value: "${POSTGRES_USER}"
        - name: POSTGRES_PASSWORD
          value: "${POSTGRES_PASSWORD}"
      ports:
        - containerPort: 5432
          hostPort: 5432
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/18/docker
    - name: mailpit
      image: docker.io/axllent/mailpit:latest
      ports:
        - containerPort: 1025
          hostPort: 1025
        - containerPort: 8025
          hostPort: 8025
    - name: kafka
      image: docker.io/apache/kafka:latest
      env:
        - name: KAFKA_NODE_ID
          value: "${KAFKA_NODE_ID}"
        - name: KAFKA_PROCESS_ROLES
          value: "${KAFKA_PROCESS_ROLES}"
        - name: KAFKA_LISTENERS
          value: "${KAFKA_LISTENERS}"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "${KAFKA_ADVERTISED_LISTENERS}"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "${KAFKA_CONTROLLER_LISTENER_NAMES}"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "${KAFKA_CONTROLLER_QUORUM_VOTERS}"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}"
      ports:
        - containerPort: 9092
          hostPort: 9092
  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: pgdata
