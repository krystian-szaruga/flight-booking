apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: pgdata
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Pod
metadata:
  name: flights-infra
spec:
  containers:
    - name: postgres
      image: docker.io/library/postgres:18
      env:
        - name: POSTGRES_DB
          value: "${DB_NAME}"
        - name: POSTGRES_USER
          value: "${DB_USER}"
        - name: POSTGRES_PASSWORD
          value: "${DB_PASSWORD}"
      ports:
        - containerPort: 5432
          hostPort: 5432
      volumeMounts:
        - name: pgdata
          mountPath: /var/lib/postgresql/18/docker
    - name: mailpit
      image: docker.io/axllent/mailpit:latest
      ports:
        - containerPort: 1025
          hostPort: 1025
        - containerPort: 8025
          hostPort: 8025
    - name: kafka
      image: docker.io/apache/kafka:latest
      env:
        - name: KAFKA_NODE_ID
          value: "${KAFKA_NODE_ID}"
        - name: KAFKA_PROCESS_ROLES
          value: "${KAFKA_PROCESS_ROLES}"
        - name: KAFKA_LISTENERS
          value: "${KAFKA_LISTENERS}"
        - name: KAFKA_ADVERTISED_LISTENERS
          value: "${KAFKA_ADVERTISED_LISTENERS}"
        - name: KAFKA_CONTROLLER_LISTENER_NAMES
          value: "${KAFKA_CONTROLLER_LISTENER_NAMES}"
        - name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP
          value: "${KAFKA_LISTENER_SECURITY_PROTOCOL_MAP}"
        - name: KAFKA_CONTROLLER_QUORUM_VOTERS
          value: "${KAFKA_CONTROLLER_QUORUM_VOTERS}"
        - name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR
          value: "${KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR}"
        - name: KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR
          value: "${KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR}"
        - name: KAFKA_TRANSACTION_STATE_LOG_MIN_ISR
          value: "${KAFKA_TRANSACTION_STATE_LOG_MIN_ISR}"
        - name: KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS
          value: "${KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS}"
      ports:
        - containerPort: 9092
          hostPort: 9092
    - name: backend
      image: localhost/flight-booking-backend:latest
      imagePullPolicy: IfNotPresent
      env:
        - name: DB_NAME
          value: "${DB_NAME}"
        - name: DB_USER
          value: "${DB_USER}"
        - name: DB_PASSWORD
          value: "${DB_PASSWORD}"
        - name: KAFKA_BOOTSTRAP_SERVERS
          value: "${KAFKA_BOOTSTRAP_SERVERS}"
        - name: NOTIFICATION_TOPIC
          value: "${NOTIFICATION_TOPIC}"
        - name: NOTIFICATION_CONSUMER_GROUP
          value: "${NOTIFICATION_CONSUMER_GROUP}"
        - name: NOTIFICATION_KAFKA_ENABLED
          value: "${NOTIFICATION_KAFKA_ENABLED}"
        - name: PAYMENT_REMINDER_ENABLED
          value: "${PAYMENT_REMINDER_ENABLED}"
        - name: PAYMENT_REMINDER_LEAD_MINUTES
          value: "${PAYMENT_REMINDER_LEAD_MINUTES}"
        - name: PAYMENT_REMINDER_CRON
          value: "${PAYMENT_REMINDER_CRON}"
        - name: DEPARTURE_REMINDER_ENABLED
          value: "${DEPARTURE_REMINDER_ENABLED}"
        - name: DEPARTURE_REMINDER_LEAD_HOURS
          value: "${DEPARTURE_REMINDER_LEAD_HOURS}"
        - name: DEPARTURE_REMINDER_CRON
          value: "${DEPARTURE_REMINDER_CRON}"
        - name: FILE_PROVIDER_ENABLED
          value: "${FILE_PROVIDER_ENABLED}"
        - name: FILE_PROVIDER_LOCATION
          value: "${FILE_PROVIDER_LOCATION}"
        - name: JWT_SECRET
          value: "${JWT_SECRET}"
        - name: PASSPORT_ENCRYPTION_KEY
          value: "${PASSPORT_ENCRYPTION_KEY}"
        - name: COOKIE_SECURE
          value: "${COOKIE_SECURE}"
        - name: SWAGGER_UI_ENABLED
          value: "${SWAGGER_UI_ENABLED}"
        - name: PULL_CRON
          value: "${PULL_CRON}"
        - name: PULL_ENABLED
          value: "${PULL_ENABLED}"
        - name: PULL_HORIZON_DAYS
          value: "${PULL_HORIZON_DAYS}"
        - name: PULL_ON_STARTUP
          value: "${PULL_ON_STARTUP}"
      ports:
        - containerPort: 8080
          hostPort: 8080
    - name: frontend
      image: localhost/flight-booking-frontend:latest
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 80
          hostPort: 5173
  volumes:
    - name: pgdata
      persistentVolumeClaim:
        claimName: pgdata